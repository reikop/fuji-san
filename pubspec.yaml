name: fuji_san
description: A native X100VI recipe library and verified USB batch writer.
publish_to: none
version: 0.3.0+11
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  crypto: ^3.0.6
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/update_windows.ps1
    - assets/builtin_recipes.json
