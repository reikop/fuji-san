name: Native builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter pub get
      - run: dart run tool/sync_apple.dart --check
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            command: flutter build windows --release
            artifact: fuji-san-windows.zip
          - os: ubuntu-latest
            target: android
            command: flutter build apk --debug
            artifact: build/app/outputs/flutter-apk/app-debug.apk
          - os: macos-15
            target: macos
            command: flutter build macos --release
            artifact: fuji-san-macos.tar.gz
          - os: macos-15
            target: ios
            command: flutter build ios --release --no-codesign
            artifact: fuji-san-ios-unsigned.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter pub get
      - run: ${{ matrix.command }}
      - name: Package Windows application
        if: matrix.target == 'windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath fuji-san-windows.zip
      - name: Preserve Apple bundle permissions and symlinks
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ '${{ matrix.target }}' = 'macos' ]; then
            tar -czf fuji-san-macos.tar.gz -C build/macos/Build/Products/Release fuji_san.app
          else
            tar -czf fuji-san-ios-unsigned.tar.gz -C build/ios/iphoneos Runner.app
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fuji-san-${{ matrix.target }}-experimental
          path: ${{ matrix.artifact }}
